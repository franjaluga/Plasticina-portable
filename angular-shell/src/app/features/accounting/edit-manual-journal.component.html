<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="mb-6 flex justify-between items-center bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
        <div>
            <h1 class="text-xl font-bold text-gray-800 tracking-tight">Editar Asiento Manual N° <span class="text-indigo-600">{{ entryNumber }}</span></h1>
            <p class="text-xs text-gray-500 mt-1">
                Periodo año: <span class="font-bold text-gray-800">{{ year }}</span> | Tipo: <span class="font-semibold text-gray-800">Asiento Manual Libre</span>
            </p>
        </div>
        <a [href]="route('accounting.system_journals')" class="inline-flex items-center text-xs font-semibold bg-white border border-gray-300 text-gray-700 px-3.5 py-2 rounded-lg shadow-sm hover:bg-gray-50 transition">
            &larr; Volver
        </a>
    </div>

    <form data-action="manualJournal.update" class="bg-white shadow-sm border border-gray-200 rounded-xl p-6" (submit)="submit('manualJournal.update', $event)">
        <input type="hidden" name="id" value="{{ journalId }}">
        <input type="hidden" name="journal" value="{{ journalId }}">
        <input type="hidden" name="_method" value="PUT">
        <input type="hidden" name="year" value="{{ year }}">
        <input type="hidden" name="month" value="{{ month }}">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Fecha del Asiento</label>
                <input type="date" name="date" value="{{ date }}" class="w-full text-xs border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Glosa / Descripción</label>
                <input type="text" name="description" value="{{ description }}" class="w-full text-xs border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>
            </div>
        </div>

        <div class="flex justify-between items-center mb-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500">Líneas del Asiento</h3>
            <button type="button" id="addRowBtn" (click)="addRow()" class="px-3 py-1.5 bg-gray-800 text-white rounded-lg text-xs font-semibold hover:bg-gray-700 transition shadow-sm">
                + Agregar Cuenta
            </button>
        </div>

        <div class="border border-gray-200 rounded-lg overflow-hidden mb-6">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-gray-800 text-white uppercase tracking-wider text-[11px]">
                        <th class="py-2.5 px-4">Cuenta Contable</th>
                        <th class="py-2.5 px-4 w-32 text-right">Debe</th>
                        <th class="py-2.5 px-4 w-32 text-right">Haber</th>
                        <th class="py-2.5 px-4 w-12 text-center">Acción</th>
                    </tr>
                </thead>
                <tbody id="entriesTableBody" class="divide-y divide-gray-100">
                    @for (row of rows; track row.key; let i = $index) {
                        <tr class="entry-row bg-white">
                            <td class="py-3 px-4">
                                <input type="hidden" [name]="'entries[' + row.key + '][component_name]'" value="{{ row.componentName }}">
                                <app-account-picker [name]="'entries[' + row.key + '][account_code]'" [value]="row.accountCode" [accounts]="accounts" [required]="true" class="w-full" className="w-full text-xs border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Código o nombre" (valueChange)="onAccountChange(row, $event)"></app-account-picker>
                            </td>
                            <td class="py-3 px-4 text-right">
                                <input type="number" step="any" min="0" [name]="'entries[' + row.key + '][debit]'" [value]="row.debit" (input)="onAmountInput(row, 'debit', $event)" (focus)="selectInput($event)" class="debit-input w-full text-right text-xs border-gray-300 rounded-md shadow-sm" required>
                            </td>
                            <td class="py-3 px-4 text-right">
                                <input type="number" step="any" min="0" [name]="'entries[' + row.key + '][credit]'" [value]="row.credit" (input)="onAmountInput(row, 'credit', $event)" (focus)="selectInput($event)" class="credit-input w-full text-right text-xs border-gray-300 rounded-md shadow-sm" required>
                            </td>
                            <td class="py-3 px-4 text-center">
                                <button type="button" (click)="removeRow(i)" class="remove-row-btn text-red-500 hover:text-red-700 font-bold text-sm px-2" title="Eliminar fila">&times;</button>
                            </td>
                        </tr>
                    }
                </tbody>
                <tfoot>
                    <tr class="bg-gray-50 font-mono text-xs border-t border-gray-200">
                        <td class="py-3 px-4 text-right font-bold text-gray-700 font-sans">
                            <div class="flex items-center justify-end space-x-2">
                                <span id="balanceIndicatorDot" [class]="'h-3 w-3 rounded-full ' + balanceDotClass + ' inline-block'"></span>
                                <span id="balanceIndicatorText" [class]="balanceTextClass">{{ balanceText }}</span>
                                <span class="ml-2">Totales Provisorios:</span>
                            </div>
                        </td>
                        <td class="py-3 px-4 text-right font-bold text-indigo-600" id="sumDebit">{{ sumDebit }}</td>
                        <td class="py-3 px-4 text-right font-bold text-indigo-600" id="sumCredit">{{ sumCredit }}</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="flex justify-end gap-3">
            <a [href]="route('accounting.system_journals')" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 hover:bg-gray-50 transition">
                Cancelar
            </a>
            <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold shadow-sm hover:bg-indigo-700 transition">
                Actualizar Asiento Manual
            </button>
        </div>
    </form>

</div>
