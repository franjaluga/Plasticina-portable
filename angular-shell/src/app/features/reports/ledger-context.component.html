<div class="max-w-4xl w-full mx-auto p-8 bg-white shadow-xl rounded-2xl border border-slate-100">
    <div class="mb-6">
        <a [href]="route('reports.analytics')" class="inline-flex items-center text-xs font-semibold bg-white text-slate-600 border border-slate-200 px-3 py-2 rounded-lg hover:bg-slate-50 transition shadow-sm">&larr; Volver</a>
    </div>
    <div class="text-center mb-8">
        <h1 class="text-2xl font-extrabold text-slate-800">Contexto: Libro Mayor</h1>
        <p class="text-sm text-slate-500 mt-1">Consulta de movimientos por cuenta contable</p>
        <p class="text-xs text-slate-400 mt-1">Inicio de actividades: {{ startLabel }}</p>
    </div>

    <div class="p-6 bg-slate-50 border border-slate-200 rounded-2xl">
        <form (submit)="submit('accounting.ledger', $event)" class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <input type="hidden" name="owner_id" [value]="ownerId">
            <div class="sm:col-span-4 p-4 bg-amber-50 border border-amber-200 rounded-xl">
                <label for="account_code" class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-2">Cuenta Contable</label>
                <app-account-picker name="account_code" id="account_code"
                    [accounts]="accounts"
                    [value]="accountCode"
                    [ownerId]="ownerId"
                    [workingYear]="startYear"
                    wrapperClass="account-search-wrap flex items-center gap-3"
                    labelClass="account-name-label truncate text-xs text-slate-600 font-semibold"
                    inputClass="w-full text-xs rounded-lg border-slate-300 shadow-sm p-2 bg-white border"
                    placeholder="Código o nombre"
                    (valueChange)="onAccountChange($event)"></app-account-picker>
            </div>
            <div>
                <label for="ledger_month" class="block text-xs font-semibold text-slate-600 mb-1">Mes</label>
                <app-select name="month" id="ledger_month"
                    [options]="monthOptions"
                    [value]="month"
                    [required]="true"
                    class="w-full text-xs rounded-lg border-slate-300 shadow-sm p-2 bg-white border"
                    className="w-full text-xs rounded-lg border-slate-300 shadow-sm p-2 bg-white border"
                    (valueChange)="onMonthChange($event)"></app-select>
            </div>
            <div>
                <label for="ledger_year" class="block text-xs font-semibold text-slate-600 mb-1">Año</label>
                <input type="number" name="year" id="ledger_year" [value]="year" [attr.min]="startYear"
                    (input)="onYearChange($event)" (change)="onYearChange($event)"
                    class="w-full text-xs rounded-lg border-slate-300 shadow-sm p-2 bg-white border" required>
            </div>
            <div class="flex items-end sm:col-span-2">
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold text-xs py-2.5 px-4 rounded-lg shadow-sm transition">
                    Generar Mayor &rarr;
                </button>
            </div>
        </form>
    </div>
</div>
